<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Musketier Snake</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #6ADB6A;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 400px;
      margin: 0 auto;
    }
    #gameCanvas {
      background: #66bb66;
      border: 2px solid #333;
      display: block;
      margin-top: 20px;
      width: 320px;
      height: 420px;
    }
    .arrow-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 15px auto;
    }
    .arrow-button {
      position: absolute;
      border-radius: 10px;
      border: none;
      background: #fff;
      color: #333;
      cursor: pointer;
      width: 50px;
      height: 50px;
      font-size: 1.1rem;
    }
    #btnUp { top: 10px; left: 75px; }
    #btnDown { bottom: 25px; left: 75px; }
    #btnLeft { top: 55px; left: 15px; }
    #btnRight { top: 55px; right: 0; }
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .overlay.hidden { display: none; }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      background: #fff;
      color: #333;
      border: none;
    }
    #gameOverMessage {
      font-family: 'Open Sans', Arial, sans-serif;
      font-size: 1.6rem;
      color: #ff66cc;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="game-container">
  <canvas id="gameCanvas"></canvas>
  <div class="arrow-container">
    <button id="btnUp" class="arrow-button">▲</button>
    <button id="btnLeft" class="arrow-button">◀</button>
    <button id="btnRight" class="arrow-button">▶</button>
    <button id="btnDown" class="arrow-button">▼</button>
  </div>
</div>
<div class="overlay hidden" id="countdownOverlay">
  <h1 id="countdownText" style="font-size:3rem;">3</h1>
</div>
<div class="overlay hidden" id="finalOverlay">
  <div id="gameOverMessage"></div>
  <div id="finalMessage" style="text-align:center; margin-bottom:20px;"></div>
  <div>
    <button id="btnFinalOkay">Okay</button>
    <button id="btnFinalRetry">Neuer Versuch</button>
  </div>
</div>
<div class="overlay hidden" id="exitOverlay">
  <div id="exitMessage" style="text-align:center; font-size:1.3rem; color:#ff0;"></div>
  <button id="btnExitOk" style="margin-top:15px;">Okay</button>
</div>
<script>
"use strict";
const canvasWidth = 320;
const canvasHeight = 420;
const gridSize = 20;
const cols = canvasWidth / gridSize;
const rows = canvasHeight / gridSize;
const canvas = document.getElementById('gameCanvas');
canvas.width = canvasWidth;
canvas.height = canvasHeight;
const ctx = canvas.getContext('2d');
let snake = [];
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let food = {};
let foodEmojis = ["🏹","💣","🔫","🍺"];
let currentFoodIndex = 0;
let score = 0;
let speed = 200; 
let eatenCount = 0;
let gameInterval = null;
let isGameOver = false;
const countdownOverlay = document.getElementById('countdownOverlay');
const countdownText = document.getElementById('countdownText');
const finalOverlay = document.getElementById('finalOverlay');
const finalMessage = document.getElementById('finalMessage');
const gameOverMessage = document.getElementById('gameOverMessage');
const btnFinalOkay = document.getElementById('btnFinalOkay');
const btnFinalRetry = document.getElementById('btnFinalRetry');
const exitOverlay = document.getElementById('exitOverlay');
const exitMessage = document.getElementById('exitMessage');
const btnExitOk = document.getElementById('btnExitOk');
const btnUp = document.getElementById('btnUp');
const btnDown = document.getElementById('btnDown');
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
function drawGameField(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font = gridSize + "px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(food.type, food.x*gridSize + gridSize/2, food.y*gridSize + gridSize/2);
  for(let i=0; i<snake.length; i++){
    let seg = snake[i];
    ctx.fillStyle = (i===0 || i===snake.length-1) ? "#000" : "purple";
    ctx.fillRect(seg.x*gridSize, seg.y*gridSize, gridSize, gridSize);
  }
  ctx.fillStyle = "#000";
  ctx.font = "12px Arial";
  ctx.textAlign = "left";
  ctx.fillText("Score: " + score, 5, 15);
}
function gameLoop(){
  direction = nextDirection;
  let head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
  if(head.x<0) head.x=cols-1;
  else if(head.x>=cols) head.x=0;
  if(head.y<0) head.y=rows-1;
  else if(head.y>=rows) head.y=0;
  for(let seg of snake){
    if(seg.x===head.x && seg.y===head.y){
      return triggerGameOver();
    }
  }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score++;
    eatenCount++;
    if(eatenCount%10===0 && speed>50){
      speed-=20;
      clearInterval(gameInterval);
      gameInterval=setInterval(gameLoop,speed);
    }
    spawnFood();
  } else {
    snake.pop();
  }
  drawGameField();
}
function initGame(){
  snake=[];
  let cx = Math.floor(cols/2);
  let cy = Math.floor(rows/2);
  snake.push({x:cx,y:cy});
  snake.push({x:cx-1,y:cy});
  snake.push({x:cx-2,y:cy});
  direction={x:1,y:0};
  nextDirection={x:1,y:0};
  score=0;
  eatenCount=0;
  speed=200;
  isGameOver=false;
  spawnFood();
  drawGameField();
}
function startGame(){
  initGame();
  clearInterval(gameInterval);
  gameInterval = setInterval(gameLoop, speed);
}
function spawnFood(){
  let valid=false;
  let fx,fy;
  while(!valid){
    fx=Math.floor(Math.random()*cols);
    fy=Math.floor(Math.random()*rows);
    valid=true;
    for(let seg of snake){
      if(seg.x===fx && seg.y===fy){ valid=false; break; }
    }
  }
  food={x:fx,y:fy,type:foodEmojis[currentFoodIndex]};
  currentFoodIndex=(currentFoodIndex+1)%foodEmojis.length;
}
function triggerGameOver(){
  clearInterval(gameInterval);
  isGameOver=true;
  let msg="Du warst ein tapferer Musketier und hast "+score+" Happen genascht";
  if(score===15) msg="Du warst ein tapferer Musketier und hast 15 Happen genascht";
  gameOverMessage.textContent=msg;
  showFinalOverlay();
}
function showFinalOverlay(){
  finalMessage.textContent="Jetzt hast Du dir ein Getränk im Musketierlager verdient";
  finalOverlay.classList.remove('hidden');
}
function showExitOverlay(){
  exitMessage.innerHTML="🍺🎊🥳 Guten Durst und viel Spaß beim Feiern 🍺🎊🥳";
  exitOverlay.classList.remove('hidden');
}
function resetGame(){
  finalOverlay.classList.add('hidden');
  exitOverlay.classList.add('hidden');
  startCountdown();
}
function startCountdown(){
  let c=3;
  countdownOverlay.classList.remove('hidden');
  countdownText.textContent=c;
  function step(){
    if(c>1){
      c--;
      countdownText.textContent=c;
      setTimeout(step,1000);
    } else {
      countdownText.textContent="Start!";
      setTimeout(()=>{
        countdownOverlay.classList.add('hidden');
        startGame();
      },1000);
    }
  }
  setTimeout(step,1000);
}
window.addEventListener('load', () => {
  startCountdown();
});
document.addEventListener('keydown', e=>{
  switch(e.key){
    case "ArrowUp": if(direction.y!==1) nextDirection={x:0,y:-1}; break;
    case "ArrowDown": if(direction.y!==-1) nextDirection={x:0,y:1}; break;
    case "ArrowLeft": if(direction.x!==1) nextDirection={x:-1,y:0}; break;
    case "ArrowRight": if(direction.x!==-1) nextDirection={x:1,y:0}; break;
  }
});
btnUp.addEventListener('click', ()=>{ if(direction.y!==1) nextDirection={x:0,y:-1}; });
btnDown.addEventListener('click', ()=>{ if(direction.y!==-1) nextDirection={x:0,y:1}; });
btnLeft.addEventListener('click', ()=>{ if(direction.x!==1) nextDirection={x:-1,y:0}; });
btnRight.addEventListener('click', ()=>{ if(direction.x!==-1) nextDirection={x:1,y:0}; });
btnFinalOkay.addEventListener('click', ()=>{
  finalOverlay.classList.add('hidden');
  showExitOverlay();
});
btnFinalRetry.addEventListener('click', ()=>{
  finalOverlay.classList.add('hidden');
  resetGame();
});
btnExitOk.addEventListener('click', ()=>{
  exitOverlay.classList.add('hidden');
});
</script>
</body>
</html>
